# Production-like infrastructure for helios-backend (05 §5 "Compose"): PostgreSQL 18, Valkey 8
# and NATS 2.15 with JetStream. Runs on Docker Desktop (Windows/WSL2, macOS) and Linux.
#
#   docker compose -f deploy/docker-compose.yml up -d            # infrastructure only
#   go run ./cmd/helios-backend --data ./saved/compose \
#       --db "postgres://helios:helios@127.0.0.1:5432/helios?sslmode=disable" \
#       --bus nats://127.0.0.1:4222 --cache valkey://127.0.0.1:6379
#
#   docker compose -f deploy/docker-compose.yml --profile backend up -d --build
#                                                                  # also run the backend image
#
# Credentials here are for local use only; staging/prod take them from the secret store
# (05 §6.5). Observability (otel-collector, Prometheus, Grafana, Tempo, Loki), MinIO,
# ClickHouse and the 3-node NATS "ha" profile arrive with the phases that need them.
name: helios

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
      POSTGRES_DB: helios
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "no", "--save", ""]   # Valkey is never the truth (05 §3.4)
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--max_payload", "1MB"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: ["nats-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    profiles: ["backend"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HELIOS_ENV: dev
      HELIOS_DATA: /data
      HELIOS_DB: postgres://helios:helios@postgres:5432/helios?sslmode=disable
      HELIOS_BUS: nats://nats:4222
      HELIOS_CACHE: valkey://valkey:6379
      HELIOS_HTTP: 0.0.0.0:7700
      HELIOS_OPS: 0.0.0.0:7701
      HELIOS_LOG_FORMAT: json
      HELIOS_SEED: dev
    ports: ["127.0.0.1:7700:7700", "127.0.0.1:7701:7701"]
    volumes: ["backend-data:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      nats: { condition: service_healthy }

volumes:
  pg-data:
  nats-data:
  backend-data:
