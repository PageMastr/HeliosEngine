# expect: secrets
# A secret in a step's environment.
on:
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: read
jobs:
  gpu:
    if: github.ref == 'refs/heads/main' && vars.HELIOS_WIN_GPU == 'enabled'
    runs-on: [self-hosted, win-gpu]
    steps:
      - run: upload
        env:
          KEY: ${{ secrets.UPLOAD_KEY }}
