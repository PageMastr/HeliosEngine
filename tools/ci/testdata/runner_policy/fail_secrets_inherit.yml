# expect: secrets
# The runner job needs a job that hands every secret to a reusable workflow; its outputs could carry them.
on:
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: read
jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit
  gpu:
    needs: prepare
    if: github.ref == 'refs/heads/main' && vars.HELIOS_WIN_GPU == 'enabled'
    runs-on: [self-hosted, win-gpu]
    steps:
      - run: echo "${{ needs.prepare.outputs.value }}"
