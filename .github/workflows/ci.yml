name: CI

# Pull requests are the gate for main (README "Contributing"); pushes to main re-verify the merged result.
# Work branches do not trigger CI on push, so WIP snapshots never start or cancel runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Keep an active main matrix running; pending runs may be superseded. The
  # per-push merge-policy audit has its own workflow so it cannot be displaced.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Primary Windows toolchain: VS 2026 / MSVC 14.5x on windows-latest.
  windows-msvc:
    name: Windows (MSVC, primary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset windows-msvc-release
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test (no GPU on hosted runners)
        run: ctest --preset windows-msvc-release -LE "gpu|perf"

  # Supported floor: VS 2022 17.14 / MSVC 14.44 on the pinned windows-2022 image (ADR-001).
  windows-msvc-floor:
    name: Windows (MSVC 14.44 floor)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"
      - name: Configure
        run: cmake --preset windows-msvc-release
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test (no GPU on hosted runners)
        run: ctest --preset windows-msvc-release -LE "gpu|perf"

  windows-clang-cl:
    name: Windows (clang-cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset windows-clang-cl
      - name: Build
        run: cmake --build --preset windows-clang-cl
      - name: Test (no GPU on hosted runners)
        run: ctest --test-dir build/windows-clang-cl -LE "gpu|perf" --output-on-failure

  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang]
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libxext-dev libxfixes-dev libxss-dev libxtst-dev libdbus-1-dev \
            libudev-dev mesa-vulkan-drivers xvfb
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test (software Vulkan via lavapipe, the only ICD on GPU-less runners)
        run: xvfb-run -a ctest --preset ${{ matrix.preset }} -LE perf

  # Dedicated-server configuration: no graphics modules may be required.
  linux-headless:
    name: Linux (headless servers + tools)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate lint SARIF converter
        run: python3 -m unittest discover -s tools/ci -p 'test_ctest_to_sarif.py'
      - name: Validate post-merge policy fixtures
        run: python3 -m unittest discover -s tools/ci -p 'test_merge_policy.py'
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux-headless
      - name: Build
        run: cmake --build --preset linux-headless
      - name: Test
        run: ctest --test-dir build/linux-headless -LE perf --output-on-failure --output-junit "$GITHUB_WORKSPACE/build/linux-headless/ctest.xml"
      - name: Convert lint failures to SARIF
        if: ${{ always() && hashFiles('build/linux-headless/ctest.xml') != '' }}
        run: python3 tools/ci/ctest_to_sarif.py --junit build/linux-headless/ctest.xml --output build/linux-headless/lints.sarif --source-root .
      - name: Upload lint SARIF artifact
        if: ${{ always() && hashFiles('build/linux-headless/lints.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-sarif
          path: build/linux-headless/lints.sarif
      # Fork PR tokens are read-only. They still produce the SARIF artifact above.
      - name: Publish lint SARIF
        if: ${{ always() && hashFiles('build/linux-headless/lints.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/linux-headless/lints.sarif
          category: helios-lints

  # Win32 code paths compiled and linked with MinGW-w64 (portability signal; binaries are not run).
  mingw-cross:
    name: Windows cross-build (MinGW-w64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix
      - name: Configure
        run: cmake --preset cross-mingw
      - name: Build
        run: cmake --build --preset cross-mingw

  services:
    name: Backend services (Go, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - name: Vet, test, cross-build
        working-directory: services
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...
          GOOS=windows go build ./...
          GOOS=linux go build ./...
        shell: bash

  services-integration:
    name: Backend integration (embedded PostgreSQL/NATS, Linux, non-root)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - name: Integration tests (embedded PostgreSQL refuses to run as root; runner user is non-root)
        working-directory: services
        env:
          HELIOS_NETCODE_INTEROP: "1"
        run: go test -tags integration ./internal/integration/...
