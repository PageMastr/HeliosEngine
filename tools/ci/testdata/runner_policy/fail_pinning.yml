# expect: pinning
# A tag can be moved to other code after review; the runner job pins commits.
on:
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: read
jobs:
  gpu:
    if: github.ref == 'refs/heads/main' && vars.HELIOS_WIN_GPU == 'enabled'
    runs-on: [self-hosted, win-gpu]
    steps:
      - uses: actions/checkout@v5
