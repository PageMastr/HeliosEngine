name: win-gpu

# Post-merge GPU work on the repository owner's Windows PC, the self-hosted runner `win-gpu`
# (docs/plan/09-roadmap-and-process.md §5.4a; WP-0.4; K33). The PC runs only merged code:
#   - triggers: the schedule and a user's workflow_dispatch, never pull requests; the job also needs main and the
#     repository variable HELIOS_WIN_GPU=enabled (the owner's switch: unset, the job is skipped, not queued).
#     tools/ci/check_runner_policy.py (CTest lint_runner_policy, every PR) fails any workflow that breaks this;
#   - no secrets, a read-only token, results as artifacts, actions pinned to commit SHAs;
#   - the runner's job-started hook (tools/ci/runner/job-started.ps1) ends every job that is not a schedule, push
#     or workflow_dispatch run of refs/heads/main by stopping the runner's worker process before the job's first
#     step (a failed hook alone would still let `if: always()` steps and actions' pre: steps run), and empties the
#     work directory for the others; firewall.ps1 blocks the runner account from the home LAN. Setup, verification
#     and rotation: docs/runbooks/win-gpu-runner.md.
# One job: the hook empties the work directory before every job, so separate jobs would each rebuild. It uploads
# the `results-win-gpu` artifact in the nightly's result-set format (run.json, host.json, CTest JUnit, gate JUnit,
# test inventory; tools/scorecard/README.md) for scorecard.jsonc's `win-gpu` run, plus ADR-0.9c's hnoise JSON and
# the rendertest output. The nightly report does not read this artifact yet (scorecard.jsonc gaps). A queued job
# waits up to 24 h for the runner, so a PC that is off at the scheduled time runs it when it comes back.

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-gpu
  cancel-in-progress: false

jobs:
  gpu:
    name: win-gpu (Vulkan goldens, GPU tests, hnoise bench)
    if: github.ref == 'refs/heads/main' && vars.HELIOS_WIN_GPU == 'enabled'
    runs-on: [self-hosted, win-gpu]
    timeout-minutes: 240
    permissions:
      contents: read
    defaults:
      run:
        # Windows PowerShell 5.1 ships with Windows; the owner's tool list has no PowerShell 7.
        shell: powershell
    env:
      PRESET: windows-vs2022
      BUILD: build/windows-vs2022
      CONFIG: RelWithDebInfo
      RESULTS: ${{ github.workspace }}\results\win-gpu
      # Optional repository variable: the discrete GPU's name when the PC has more than one adapter (ADR-0.9c §6).
      HELIOS_RHI_ADAPTER: ${{ vars.HELIOS_WIN_GPU_ADAPTER }}
      PYTHONNOUSERSITE: "1"
    steps:
      # Before any repository code runs (09 §5.4a, account isolation). Administrators shows in the token even when
      # UAC filters it to deny-only, and the group's member list catches a membership added after the service
      # started. Every other user profile on the PC (HKLM ProfileList) must refuse a listing.
      - name: Runner isolation (not an administrator; other users' profiles unreadable)
        run: |
          $me = [Security.Principal.WindowsIdentity]::GetCurrent()
          $mySid = $me.User.Value
          Write-Output "Runner account: $($me.Name) ($mySid)"
          $problems = New-Object System.Collections.Generic.List[string]
          $groups = & "$env:SystemRoot\System32\whoami.exe" /groups /fo csv /nh |
            ConvertFrom-Csv -Header Name, Type, Sid, Attributes
          if ($LASTEXITCODE -ne 0) { throw 'whoami /groups failed' }
          if (@($groups | Where-Object { $_.Sid -eq 'S-1-5-32-544' }).Count -gt 0) {
            $problems.Add('the token holds BUILTIN\Administrators (S-1-5-32-544)')
          }
          $adminsSid = New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-544'
          $adminsName = $adminsSid.Translate([Security.Principal.NTAccount]).Value.Split('\')[-1]
          $group = [ADSI]"WinNT://$env:COMPUTERNAME/$adminsName,group"
          foreach ($member in @($group.psbase.Invoke('Members'))) {
            try {
              $bytes = $member.GetType().InvokeMember('objectSid', 'GetProperty', $null, $member, $null)
              $sid = [Security.Principal.SecurityIdentifier]::new([byte[]]$bytes, 0).Value
            } catch {
              # e.g. a cloud (Entra ID) role; the token check above still covers this account
              Write-Output "Skipped an Administrators member whose SID cannot be read: $($_.Exception.Message)"
              continue
            }
            if ($sid -eq $mySid) { $problems.Add("$($me.Name) is a member of the local Administrators group") }
          }
          $tested = 0
          $list = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList'
          foreach ($key in Get-ChildItem -LiteralPath $list) {
            # Exact names: a prefix match would also skip another user whose RID starts with this one's.
            # Local and domain accounts (S-1-5-21-*) and Entra ID accounts (S-1-12-1-*); not the service profiles.
            if ($key.PSChildName -notmatch '^S-1-(5-21|12-1)-' -or $key.PSChildName -in @($mySid, "$mySid.bak")) { continue }
            $profileDir = (Get-ItemProperty -LiteralPath $key.PSPath).ProfileImagePath
            $profileDir = [Environment]::ExpandEnvironmentVariables($profileDir)
            foreach ($sub in '', 'AppData', 'Documents', '.ssh') {
              $path = if ($sub) { Join-Path $profileDir $sub } else { $profileDir }
              try {
                $null = [IO.Directory]::GetFileSystemEntries($path)
                $problems.Add("can list $path")
              } catch [UnauthorizedAccessException] {
                if (-not $sub) { $tested++ }
              } catch [IO.DirectoryNotFoundException] {
              }
            }
          }
          if ($tested -eq 0) { $problems.Add('no other user profile was found to test (HKLM ProfileList)') }
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Output "::error::Runner isolation: $_" }
            throw 'The runner account is not isolated (09 section 5.4a): see docs/runbooks/win-gpu-runner.md'
          }
          Write-Output "Not an administrator; $tested other user profile(s) refuse a listing"

      # 09 §5.4a, network: tools/ci/runner/firewall.ps1 blocks the account from the home LAN. A smoke test of the
      # rules: a TCP connection to the default gateway that succeeds, or that the gateway refuses (its reset reached
      # the PC), proves them missing. The block fails the connect locally with access denied (WSAEACCES), and at
      # least one connect must, since a gateway that silently drops these ports times out with no rule at all.
      - name: LAN egress blocked (tools/ci/runner/firewall.ps1)
        run: |
          $gateways = @([Net.NetworkInformation.NetworkInterface]::GetAllNetworkInterfaces() |
            Where-Object { $_.OperationalStatus -eq 'Up' } |
            ForEach-Object { $_.GetIPProperties().GatewayAddresses } | ForEach-Object { $_.Address } |
            Where-Object { $_.AddressFamily -eq 'InterNetwork' -and $_.ToString() -ne '0.0.0.0' } |
            ForEach-Object { $_.ToString() } | Select-Object -Unique)
          if ($gateways.Count -eq 0) { throw 'No IPv4 default gateway found, so the LAN block cannot be tested' }
          $reached = @()
          $denied = 0
          foreach ($gateway in $gateways) {
            foreach ($port in 53, 80, 443) {
              $client = New-Object Net.Sockets.TcpClient
              try {
                if ($client.ConnectAsync($gateway, $port).Wait(3000) -and $client.Connected) {
                  $reached += "${gateway}:$port"
                }
              } catch {
                $e = $_.Exception
                while ($e -and -not ($e -is [Net.Sockets.SocketException])) { $e = $e.InnerException }
                if ($e -and $e.SocketErrorCode -eq [Net.Sockets.SocketError]::ConnectionRefused) {
                  $reached += "${gateway}:$port (refused by the gateway)"
                } elseif ($e -and $e.SocketErrorCode -eq [Net.Sockets.SocketError]::AccessDenied) {
                  $denied++
                }
              } finally {
                $client.Close()
              }
            }
          }
          if ($reached.Count -gt 0) {
            throw ("The runner account reached the LAN ($($reached -join ', ')): run tools/ci/runner/firewall.ps1 " +
              '(docs/runbooks/win-gpu-runner.md)')
          }
          if ($denied -eq 0) {
            throw ('No connection to the default gateway was denied locally, so the firewall block is not shown to be ' +
              'active (only timeouts): run tools/ci/runner/firewall.ps1 (docs/runbooks/win-gpu-runner.md)')
          }
          Write-Output ("The default gateway(s) $($gateways -join ', ') accepted no TCP connection on ports 53, 80, 443; " +
            "the firewall denied $denied")

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Go: configure registers tools/conformance's lint tests and requires Go when CI is set, as the runner sets it.
      - name: Tools, the Vulkan SDK, and the run's result set
        run: |
          foreach ($tool in 'git', 'cmake', 'ctest', 'python', 'go') {
            $found = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw "$tool is not on the runner account's PATH (docs/runbooks/win-gpu-runner.md, step 4)" }
            Write-Output "${tool}: $($found.Path)"
          }
          & python --version
          if ($LASTEXITCODE -ne 0) { throw 'python does not run (the Microsoft Store alias?)' }
          # The goldens run validated only if configure finds the Khronos layer, which on Windows it looks for
          # under VULKAN_SDK alone (tools/rendertest/README.md).
          if (-not $env:VULKAN_SDK) { throw 'VULKAN_SDK is not set for the runner service: install the Vulkan SDK, then restart the service' }
          $layer = Join-Path $env:VULKAN_SDK 'Bin\VkLayer_khronos_validation.json'
          if (-not (Test-Path -LiteralPath $layer)) { throw "No Khronos validation layer at $layer" }
          Write-Output "Vulkan SDK: $env:VULKAN_SDK"
          # Temporary files go to the runner's per-job directory, which the runner empties, not the account profile.
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:RESULTS | Out-Null
          Set-Content -Encoding ascii -Path "$env:RESULTS\run.json" -Value '{"run": "win-gpu"}'
          python tools/scorecard/runners.py host --out "$env:RESULTS\host.json"

      # windows-vs2022 rather than ADR-0.9c §6's windows-msvc-release: the same MSVC and RelWithDebInfo flags, but
      # MSBuild finds the toolset itself, where Ninja would need a developer shell from a third-party action.
      - name: Configure
        run: cmake --preset $env:PRESET
      - name: Build
        run: cmake --build --preset $env:PRESET --parallel

      # Where helios-rendertest writes its results: CTest's own record of rendertest.report's --out argument
      # (the tool builds under engine/render/ until tools/CMakeLists.txt lists it), not a guessed path.
      - name: Locate the rendertest output (from CTest)
        run: |
          $listing = & ctest --test-dir $env:BUILD -C $env:CONFIG -N -R '^rendertest\.report$' --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { throw 'ctest could not list rendertest.report' }
          $report = @(($listing | Out-String | ConvertFrom-Json).tests | Where-Object { $_.name -eq 'rendertest.report' })
          if ($report.Count -ne 1) { throw 'CTest lists no rendertest.report test, so the rendertest output is unknown' }
          $command = @($report[0].command)
          $at = [Array]::IndexOf($command, '--out')
          if ($at -lt 0 -or $at + 1 -ge $command.Count) { throw "rendertest.report has no --out argument: $($command -join ' ')" }
          $out = [IO.Path]::GetFullPath($command[$at + 1])
          Write-Output "rendertest output: $out"
          "RENDERTEST_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Diagnostics only; this step never fails the job. What the Vulkan loader sees in this process, so a GPU test
      # failure explains itself from the log. The loader ignores VK_LOADER_LAYERS_DISABLE, VK_LAYER_PATH,
      # VK_ADD_LAYER_PATH and VK_DRIVER_FILES in a process of High integrity or above, and a service's token is High
      # (the SERVICE group grants SeImpersonatePrivilege); a loader settings file (Vulkan Configurator) can force
      # layers on or off. rendertest.validation-required reports cases it cannot set up then as a NOTE.
      - name: Vulkan loader, layers and adapters (diagnostics)
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Section([string] $title) { Write-Output ''; Write-Output "== $title" }
          function Show-File([string] $path, [int] $lines) {
            if (Test-Path -LiteralPath $path) {
              Write-Output "-- $path"
              Get-Content -LiteralPath $path -TotalCount $lines | ForEach-Object { Write-Output "   $_" }
            } else {
              Write-Output "-- $path (missing)"
            }
          }
          try {
            Show-Section 'Process token (the loader ignores layer and driver variables at High integrity and above)'
            & "$env:SystemRoot\System32\whoami.exe" /groups /fo csv /nh | ConvertFrom-Csv -Header Name, Type, Sid, Attributes |
              Where-Object { $_.Sid -like 'S-1-16-*' } | ForEach-Object { Write-Output "integrity: $($_.Name) ($($_.Sid))" }
            & "$env:SystemRoot\System32\whoami.exe" /priv /fo csv /nh | ConvertFrom-Csv -Header Name, Description, State |
              Where-Object { $_.Name -eq 'SeImpersonatePrivilege' } | ForEach-Object { Write-Output "$($_.Name): $($_.State)" }

            Show-Section 'Environment (VK_*, VULKAN_SDK)'
            Get-ChildItem env: | Where-Object { $_.Name -like 'VK_*' -or $_.Name -eq 'VULKAN_SDK' } |
              Sort-Object Name | ForEach-Object { Write-Output "$($_.Name)=$($_.Value)" }

            Show-Section 'Vulkan loader'
            $loader = Join-Path $env:SystemRoot 'System32\vulkan-1.dll'
            if (Test-Path -LiteralPath $loader) {
              $info = (Get-Item -LiteralPath $loader).VersionInfo
              Write-Output "$loader file version $($info.FileVersion), product version $($info.ProductVersion)"
            } else {
              Write-Output "no $loader"
            }

            Show-Section 'Khronos validation layer (the manifest configure found under VULKAN_SDK)'
            $manifest = Join-Path $env:VULKAN_SDK 'Bin\VkLayer_khronos_validation.json'
            if (Test-Path -LiteralPath $manifest) {
              $layer = (Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).layer
              Write-Output "$manifest`: $($layer.name) api_version $($layer.api_version), implementation_version $($layer.implementation_version), library_path $($layer.library_path)"
              $library = Join-Path (Split-Path -Parent $manifest) $layer.library_path
              if (Test-Path -LiteralPath $library) { Write-Output "$library file version $((Get-Item -LiteralPath $library).VersionInfo.FileVersion)" }
            } else {
              Write-Output "no $manifest"
            }

            Show-Section 'Registry: HKLM and HKCU \SOFTWARE\Khronos\Vulkan (value 0 = enabled)'
            foreach ($hive in 'HKLM', 'HKCU') {
              foreach ($key in 'ExplicitLayers', 'ImplicitLayers', 'Drivers', 'LoaderSettings') {
                $path = "${hive}:\SOFTWARE\Khronos\Vulkan\$key"
                $item = Get-Item -LiteralPath $path -ErrorAction SilentlyContinue
                if (-not $item) { Write-Output "$path (none)"; continue }
                Write-Output $path
                foreach ($name in $item.Property) {
                  Write-Output "   $name = $($item.GetValue($name))"
                  # A loader settings file (Vulkan Configurator) overrides layer environment variables for "on" and "off" layers.
                  if ($key -eq 'LoaderSettings') { Show-File $name 60 }
                }
              }
            }

            Show-Section 'Adapters (vulkaninfo --summary)'
            $vulkaninfo = Get-Command vulkaninfo -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($vulkaninfo) {
              cmd /c "`"$($vulkaninfo.Path)`" --summary 2>&1" | Select-Object -First 120 | ForEach-Object { Write-Output "   $_" }
            } else {
              Write-Output 'vulkaninfo is not on PATH'
            }

            Show-Section 'The RHI under rendertest.validation-required''s first case (VK_LOADER_LAYERS_DISABLE, loader log filtered)'
            $tool = Get-ChildItem -LiteralPath $env:BUILD -Recurse -Filter helios-rendertest.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($tool) {
              $env:HELIOS_RHI_VALIDATION = '1'
              $env:VK_LOADER_LAYERS_DISABLE = 'VK_LAYER_KHRONOS_validation'
              $env:VK_LOADER_DEBUG = 'all'
              cmd /c "`"$($tool.FullName)`" --print-probe 2>&1" |
                Select-String -Pattern 'elevated|ignored|forced|settings|disabled|Khronos validation|device:' |
                Select-Object -First 60 | ForEach-Object { Write-Output "   $($_.Line)" }
              Remove-Item env:HELIOS_RHI_VALIDATION, env:VK_LOADER_LAYERS_DISABLE, env:VK_LOADER_DEBUG
            } else {
              Write-Output "no helios-rendertest.exe under $env:BUILD"
            }
          } catch {
            Write-Output "diagnostics stopped early: $($_.Exception.Message)"
          }
          exit 0  # the runner would otherwise return the last native command's exit code

      # Label gpu: rendertest.vulkan.* (the goldens; RC-1), rendertest.validation-*, rhi_tests_gpu, pcg_gpu_tests
      # (the Slang twin, bit for bit; RT-04) and rhi_triangle_smoke, on the hardware adapter.
      - name: GPU tests (label gpu, on the hardware GPU)
        run: ctest --test-dir $env:BUILD -C $env:CONFIG -L gpu --output-on-failure --output-junit "$env:RESULTS\ctest.xml"
      # As ci.yml's Linux jobs do: the layer must have loaded and reported itself (03 §1.5, RC-1).
      - name: Khronos validation layer loaded
        if: ${{ !cancelled() }}
        run: |
          $log = @(& ctest --test-dir $env:BUILD -C $env:CONFIG -R '^rendertest\.validation-layer$' -V)
          $status = $LASTEXITCODE
          $log | Write-Output
          if ($status -ne 0) { throw 'rendertest.validation-layer failed' }
          if (-not ($log -match '^\d+: validation layer: VK_LAYER_KHRONOS_validation \d+\.\d+')) {
            throw 'The validation layer did not report itself, so the goldens ran unvalidated'
          }

      # ADR-0.9c §6 step 1 (WP-0.9c, K5b): tiles per 0.8 ms on this GPU and CPU ms per tile. Exit code 2 means the
      # AVX2 kernel did not run, 3 that the GPU batch differs from the CPU; both fail the step.
      - name: hnoise throughput on the hardware GPU (ADR-0.9c)
        if: ${{ !cancelled() }}
        run: >
          python tools/scorecard/runners.py gate --name pcg_hnoise_bench_hardware_gpu --build-dir $env:BUILD
          --config $env:CONFIG --timeout 3600 --out "$env:RESULTS\gates" --
          pcg_hnoise_bench --hardware-gpu --tiles=64 --gpu-tiles=64 --repeats=20 "--json=$env:RESULTS\hnoise-win-gpu.json"
      # NS-0.2's re-test on fixed hardware (the owner's approval of 2026-09-30 owes it): strict, without --advisory.
      - name: net_bench --gate, strict (NS-0.2, NS-0.7; 10 min)
        if: ${{ !cancelled() }}
        run: >
          python tools/scorecard/runners.py gate --name net_bench_gate --build-dir $env:BUILD --config $env:CONFIG
          --timeout 1800 --out "$env:RESULTS\gates" -- net_bench --gate
      # The goldens prefer a software adapter, and the bench prints "GPU: unavailable" and exits 0 without one, so a
      # PC with a software Vulkan driver, or whose GPU the service session cannot see, would pass both without
      # touching the GPU. Each must name a hardware adapter.
      - name: The goldens and the bench ran on a hardware GPU
        if: ${{ !cancelled() }}
        run: |
          $software = 'llvmpipe|lavapipe|swiftshader|software|basic render'
          $adapter = '"adapter": "((?:[^"\\]|\\.)*)"'
          $missing = @()     # no result, or a result without an adapter: the work did not run (see the steps above)
          $onSoftware = @()  # a result from a software rasterizer: the wrong adapter was picked
          if (-not $env:RENDERTEST_OUT) { throw 'The rendertest output directory is unknown (see "Locate the rendertest output")' }
          $dir = Join-Path $env:RENDERTEST_OUT 'vulkan'
          $results = @(Get-ChildItem -LiteralPath $dir -Filter *.json -ErrorAction SilentlyContinue)
          if ($results.Count -eq 0) { $missing += "no rendertest results in $dir" }
          foreach ($file in $results) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            $m = [regex]::Match($text, $adapter)
            $name = if ($m.Success) { $m.Groups[1].Value } else { '' }
            $status = [regex]::Match($text, '"status": "([a-z]*)"').Groups[1].Value
            Write-Output "rendertest $($file.BaseName) ($status): $name"
            if (-not $name) {
              $missing += "rendertest $($file.BaseName) recorded no adapter (status '$status'; see its message in $($file.FullName))"
            } elseif ($name -match $software) {
              $onSoftware += "rendertest $($file.BaseName) ran on '$name'"
            }
          }
          $bench = "$env:RESULTS\hnoise-win-gpu.json"
          $text = if (Test-Path -LiteralPath $bench) { Get-Content -LiteralPath $bench -Raw } else { '' }
          $m = [regex]::Match($text, '"gpu": \{\s*' + $adapter)
          $name = if ($m.Success) { $m.Groups[1].Value } else { '' }
          Write-Output "pcg_hnoise_bench: $name"
          if (-not $text) {
            $missing += "no pcg_hnoise_bench result at $bench"
          } elseif (-not $name) {
            $missing += 'pcg_hnoise_bench found no GPU ("GPU: unavailable")'
          } elseif ($name -match $software) {
            $onSoftware += "pcg_hnoise_bench measured '$name'"
          }
          ($missing + $onSoftware) | ForEach-Object { Write-Output "::error::$_" }
          if ($missing.Count -gt 0) {
            throw ('No GPU results were found: ' + ($missing -join '; ') + ' (the GPU tests or the bench did not ' +
              'run or failed first: see their steps above)')
          }
          if ($onSoftware.Count -gt 0) {
            throw ('The GPU work ran on a software adapter: ' + ($onSoftware -join '; ') + ' (with two adapters, set ' +
              'HELIOS_WIN_GPU_ADAPTER to part of the GPU''s name; docs/runbooks/win-gpu-runner.md)')
          }
      - name: Test inventory and the rendertest output
        if: ${{ !cancelled() }}
        run: |
          python tools/scorecard/scorecard.py inventory --build-dir $env:BUILD --config $env:CONFIG --out "$env:RESULTS\inventory.json"
          if ($LASTEXITCODE -ne 0) { throw 'scorecard.py inventory failed' }
          # import_goldens.cmake files hardware goldens from this copy (tools/rendertest/README.md).
          if ($env:RENDERTEST_OUT -and (Test-Path -LiteralPath $env:RENDERTEST_OUT)) {
            Copy-Item -LiteralPath $env:RENDERTEST_OUT -Destination "$env:RESULTS\rendertest" -Recurse
          } else {
            Write-Output "::warning::no rendertest output at '$env:RENDERTEST_OUT' to upload"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: results-win-gpu
          path: results/win-gpu
          retention-days: 30
